<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #todoList {
            border-collapse: collapse;
            width: 70%;
            margin: 0 auto;
        }
        #todoList th, #todoList td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #todoList th {
            background-color: #f0f0f0;
        }
        #todoList th:first-child {
            width: 5%;
        }
        #todoList th:nth-child(2) {
            width: 65%;
        }
        #todoList th:nth-child(3), #todoList th:nth-child(4) {
            width: 15%;
        }
        .add-form {
            margin-top: 20px;
            width: 70%;
            margin: 20px auto;
        }
        .add-form input[type="text"] {
            padding: 8px;
            width: 70%;
        }
        .add-form button {
            padding: 8px;
            width: 20%;
        }
        .edit-input {
            width: 100%;
            box-sizing: border-box;
            padding: 6px;
        }
    </style>
</head>
<body>

<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
    <thead>
        <tr>
            <th>Number</th>
            <th>Text</th>
            <th>Edit</th>
            <th>Remove</th>
        </tr>
    </thead>
    <tbody id="listBody">
        {{rows}}
    </tbody>
</table>

<div class="add-form">
    <input type="text" id="newItem" placeholder="Enter new item" />
    <button id="addBtn">Add</button>
</div>

<script>
    // Получаем список задач с сервера
    async function fetchList() {
        try {
            const response = await fetch('/list');
            if (!response.ok) throw new Error('Failed to fetch list');
            const items = await response.json();
            renderList(items);
        } catch (err) {
            alert('Error loading list: ' + err.message);
        }
    }

    // Рендер списка с кнопками редактирования и удаления
    function renderList(items) {
        const listBody = document.getElementById('listBody');
        listBody.innerHTML = '';
        items.forEach((item, index) => {
            const row = document.createElement('tr');

            row.innerHTML = `
                <td>${index + 1}</td>
                <td class="text-cell">${escapeHtml(item.text)}</td>
                <td>
                    <button class="edit-btn" data-id="${item.id}">Edit</button>
                </td>
                <td>
                    <button class="remove-btn" data-id="${item.id}">Remove</button>
                </td>
            `;

            listBody.appendChild(row);
        });

        // Обработчики кнопок "Edit"
        document.querySelectorAll('.edit-btn').forEach(button => {
            button.addEventListener('click', () => {
                const tr = button.closest('tr');
                const textCell = tr.querySelector('.text-cell');
                const id = button.getAttribute('data-id');

                // Если уже в режиме редактирования — не делать ничего
                if (textCell.querySelector('input')) return;

                const currentText = textCell.textContent;

                // Заменяем текст на input
                textCell.innerHTML = `<input type="text" class="edit-input" value="${escapeHtmlAttr(currentText)}" />`;

                // Меняем кнопку "Edit" на "Save"
                button.textContent = 'Save';

                // Добавляем кнопку "Cancel"
                const cancelBtn = document.createElement('button');
                cancelBtn.textContent = 'Cancel';
                cancelBtn.className = 'cancel-btn';
                button.after(cancelBtn);

                // Обработчик "Save"
                button.onclick = async () => {
                    const input = textCell.querySelector('input');
                    const newText = input.value.trim();
                    if (!newText) {
                        alert('Task text cannot be empty');
                        return;
                    }
                    try {
                        const response = await fetch('/edit', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ id, text: newText })
                        });
                        if (!response.ok) throw new Error('Failed to update item');
                        await fetchList();
                    } catch (err) {
                        alert('Error updating item: ' + err.message);
                    }
                };

                // Обработчик "Cancel"
                cancelBtn.onclick = () => {
                    textCell.textContent = currentText;
                    button.textContent = 'Edit';
                    cancelBtn.remove();
                    button.onclick = null; // сбросить обработчик, чтобы назначить заново ниже
                    // Повторно назначаем обработчик "Edit"
                    button.addEventListener('click', () => {
                        renderList(items); // перерендерить, чтобы сбросить состояние
                    }, { once: true });
                };
            });
        });

        // Обработчики кнопок "Remove"
        document.querySelectorAll('.remove-btn').forEach(button => {
            button.addEventListener('click', async () => {
                const id = button.getAttribute('data-id');
                if (confirm('Are you sure you want to delete this item?')) {
                    try {
                        const response = await fetch('/delete?id=' + id, { method: 'DELETE' });
                        if (!response.ok) throw new Error('Failed to delete item');
                        await fetchList();
                    } catch (err) {
                        alert('Error deleting item: ' + err.message);
                    }
                }
            });
        });
    }

    // Добавление новой задачи
    async function addItem() {
        const input = document.getElementById('newItem');
        const text = input.value.trim();
        if (!text) return alert('Please enter a task');

        try {
            const response = await fetch('/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            if (!response.ok) throw new Error('Failed to add item');
            input.value = '';
            await fetchList();
        } catch (err) {
            alert('Error adding item: ' + err.message);
        }
    }

    document.getElementById('addBtn').addEventListener('click', addItem);

    // Загрузка списка при загрузке страницы
    fetchList();

    // Функции для экранирования текста, чтобы избежать XSS
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    function escapeHtmlAttr(text) {
        return text.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
</script>

</body>
</html>
