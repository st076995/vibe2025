<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #todoList {
            border-collapse: collapse;
            width: 70%;
            margin: 0 auto;
        }
        #todoList th, #todoList td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #todoList th {
            background-color: #f0f0f0;
        }
        #todoList th:first-child, #todoList th:last-child {
            width: 5%;
        }
        #todoList th:nth-child(2) {
            width: 90%;
        }
        .add-form {
            margin-top: 20px;
            width: 70%;
            margin: 20px auto;
        }
        .add-form input[type="text"] {
            padding: 8px;
            width: 70%;
        }
        .add-form button {
            padding: 8px;
            width: 20%;
        }
    </style>
</head>
<body>

<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
    <thead>
        <tr>
            <th>Number</th>
            <th>Text</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="listBody">
        {{rows}}
    </tbody>
</table>

<div class="add-form">
    <input type="text" id="newItem" placeholder="Enter new item" />
    <button id="addBtn">Add</button>
</div>

<script>
    // Функция обновления списка из сервера
    async function fetchList() {
        try {
            const response = await fetch('/list');
            if (!response.ok) throw new Error('Failed to fetch list');
            const items = await response.json();
            renderList(items);
        } catch (err) {
            alert('Error loading list: ' + err.message);
        }
    }

    // Функция рендера списка в таблицу
    function renderList(items) {
        const listBody = document.getElementById('listBody');
        listBody.innerHTML = '';
        items.forEach((item, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${item.text}</td>
                <td><button class="remove-btn" data-id="${item.id}">Remove</button></td>
            `;
            listBody.appendChild(row);
        });

        // Добавляем обработчики удаления (если нужно, можно реализовать)
        // Для текущей задачи можно оставить пустым или реализовать позже
    }

    // Отправка новой задачи на сервер
    async function addItem() {
        const input = document.getElementById('newItem');
        const text = input.value.trim();
        if (!text) return alert('Please enter a task');

        try {
            const response = await fetch('/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            if (!response.ok) throw new Error('Failed to add item');
            input.value = '';
            await fetchList(); // обновляем список
        } catch (err) {
            alert('Error adding item: ' + err.message);
        }
    }

    document.getElementById('addBtn').addEventListener('click', addItem);

    // Загрузка списка при загрузке страницы
    fetchList();
</script>

</body>
</html>
